name: Ruby

# Pull requests run on pull_request, thus push runs only for master
on:
  push:
    branches: [master]
  pull_request:

# A newer push to a pull request cancels its running checks. Each master
# push gets its own group, thus master runs are never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    name: Lint
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/ruby/setup-ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install codespell
        run: pipx install codespell==2.4.3

      - name: Check spelling
        run: codespell --skip="./sig,./doc,./coverage,./vendor"

      - name: Check code standards
        run: bundle exec rubocop

      - name: Markdown linter
        run: bundle exec mdl README.md CHANGELOG.md RELEASE.md

      - name: Check documentation links
        run: bundle exec rake docs:check

      - name: Check lockfile matches VERSION
        run: bundle exec rake release:lockfile

      - name: Check API documentation coverage
        run: bundle exec rake rdoc:coverage

      - name: Validate type signatures
        run: bundle exec rbs -I sig validate

      - name: Steep
        run: bundle exec steep check

  build:
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # https://github.com/ruby/setup-ruby
          # A failure on Ruby head does not fail CI
          - ruby: "head"
            experimental: true
            bundle_force_ruby_platform: "1"
          # Ruby 4.1 is in preview until its December release; a failure does not fail CI
          - ruby: "4.1.0-preview1"
            experimental: true
          - ruby: "4.0"
            coverage: true
          - ruby: "3.4"
          - ruby: "3.3"
          - ruby: "truffleruby-40.0.0"

    env:
      BUNDLE_FORCE_RUBY_PLATFORM: ${{ matrix.bundle_force_ruby_platform || '' }}
      COVERAGE: ${{ matrix.coverage && 'true' || 'false' }}

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/ruby/setup-ruby
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec
